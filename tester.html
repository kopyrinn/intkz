<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Карусель партнёров</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
    }

    .carousel-container {
      overflow: hidden;
      padding: 20px;
    }

    .carousel-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-item {
      min-width: 150px;
      flex-shrink: 0;
    }

    .carousel-item img {
      width: 100px;
      height: auto;
      border-radius: 8px;
      padding: 10px;
      background: #f5f5f5;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .carousel-item {
        min-width: 120px;
      }
    }
  </style>
</head>
<body>

<div class="carousel-container">
  <div class="carousel-track" id="carouselTrack">
    <!-- Картинки будут добавлены через JavaScript -->
  </div>
</div>

<script>
  const track = document.getElementById('carouselTrack');

// Добавляем 20 изображений
for (let i = 1; i <= 20; i++) {
  const item = document.createElement('div');
  item.className = 'carousel-item';
  const img = document.createElement('img');
  img.src = `./assets/img/clients/${i}.jpg`;
  img.alt = `Партнёр ${i}`;
  item.appendChild(img);
  track.appendChild(item);
}

// === Автопрокрутка ===
let scrollPos = 0;
let maxScrollLeft = track.scrollWidth - track.clientWidth; // максимальный скролл

function scrollNext() {
  scrollPos += 1; // Прокручиваем на 1 пиксель

  // Если дошли до конца — сбрасываем в начало
  if (scrollPos >= maxScrollLeft) {
    scrollPos = 0; // Начинаем с начала
    track.scrollLeft = 0;
  } else {
    track.scrollLeft = scrollPos;
  }
}

let autoScroll = setInterval(scrollNext, 10); // Скорость прокрутки можно регулировать

// === Свайп мышкой ===
let isDown = false;
let startX;
let scrollLeft;

track.addEventListener('mousedown', (e) => {
  clearInterval(autoScroll);
  isDown = true;
  startX = e.pageX - track.offsetLeft;
  scrollLeft = track.scrollLeft;
  track.style.cursor = 'grabbing';
});

track.addEventListener('mouseleave', () => {
  isDown = false;
  track.style.cursor = 'grab';
  autoScroll = setInterval(scrollNext, 10);
});

track.addEventListener('mouseup', () => {
  isDown = false;
  track.style.cursor = 'grab';
  autoScroll = setInterval(scrollNext, 10);
});

track.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - track.offsetLeft;
  const walk = (x - startX) * 1.5;
  track.scrollLeft = scrollLeft - walk;
});

// === Свайп пальцем ===
let touchStartX = 0;
let touchScrollLeft = 0;

track.addEventListener('touchstart', (e) => {
  clearInterval(autoScroll);
  touchStartX = e.touches[0].pageX;
  touchScrollLeft = track.scrollLeft;
});

track.addEventListener('touchend', () => {
  autoScroll = setInterval(scrollNext, 10);
});

track.addEventListener('touchmove', (e) => {
  const x = e.touches[0].pageX;
  const walk = (x - touchStartX) * 1.5;
  track.scrollLeft = touchScrollLeft - walk;
});

</script>

</body>
</html>
